; pytest.ini
; -----------
; Configuration for pytest, the test runner.
; Running `pytest` from the project root picks this up automatically.

[pytest]
; Look for tests only in the tests/ folder.
testpaths = tests

; Treat files named test_*.py as test files (the default, stated for clarity).
python_files = test_*.py

; Treat classes named Test* and functions named test_* as tests.
python_classes = Test*
python_functions = test_*

; Command-line options applied every run:
;   -v               verbose: show each test name and PASS/FAIL
;   --strict-markers  error on unknown @pytest.mark markers (catches typos)
;   --tb=short        short, readable tracebacks on failure
addopts = -v --strict-markers --tb=short
